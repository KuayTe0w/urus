<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>URUS — account</title><link rel="stylesheet" href="assets/css/api.css"></head><body><main class="login"><h1>URUS</h1><p id="intro">Sign in to manage your inventory.</p><form id="login-form"><label>Email<input id="email" type="email" required autocomplete="username"></label><label>Password<input id="password" type="password" required minlength="6" autocomplete="current-password"></label><label id="confirm-label" hidden>Confirm password<input id="confirm-password" type="password" minlength="6" autocomplete="new-password"></label><button id="submit">Sign in</button></form><p id="message" role="alert"></p><button id="switch-mode" class="secondary" type="button">Create an account</button></main><script type="module" src="assets/js/login.js"></script></body></html>
