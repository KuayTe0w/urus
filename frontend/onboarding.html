<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>URUS — add business</title><link rel="stylesheet" href="assets/css/api.css"></head><body><main class="login"><h1>Add your business</h1><p>Create a business to start managing inventory.</p><form id="business-form"><label>Business name<input id="name" required maxlength="120" autocomplete="organization"></label><label>Currency<select id="currency" required><option value="BND">BND — Brunei dollar</option><option value="IDR">IDR — Indonesian rupiah</option><option value="KHR">KHR — Cambodian riel</option><option value="LAK">LAK — Lao kip</option><option value="MMK">MMK — Myanmar kyat</option><option value="MYR">MYR — Malaysian ringgit</option><option value="PHP">PHP — Philippine peso</option><option value="SGD">SGD — Singapore dollar</option><option value="THB">THB — Thai baht</option><option value="VND">VND — Vietnamese dong</option><option value="USD">USD — US dollar</option></select></label><label>Time zone<select id="timezone" required><option value="Asia/Brunei">Brunei</option><option value="Asia/Jakarta">Jakarta</option><option value="Asia/Makassar">Makassar</option><option value="Asia/Jayapura">Jayapura</option><option value="Asia/Phnom_Penh">Phnom Penh</option><option value="Asia/Vientiane">Vientiane</option><option value="Asia/Yangon">Yangon</option><option value="Asia/Kuala_Lumpur">Kuala Lumpur</option><option value="Asia/Manila">Manila</option><option value="Asia/Singapore">Singapore</option><option value="Asia/Bangkok">Bangkok</option><option value="Asia/Ho_Chi_Minh">Ho Chi Minh City</option><option value="Asia/Dili">Dili</option></select></label><button id="submit">Create business</button></form><p id="message" role="alert"></p><p id="back-link" hidden><a href="settings.html">Back to settings</a></p><button id="logout" type="button" class="secondary">Sign out</button></main><script type="module" src="assets/js/onboarding.js"></script></body></html>
