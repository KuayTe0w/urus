<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urus Dashboard</title>

    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/app.js" defer></script>
</head>
<body>
    <div class="container">
        <!--HEADER-->
        <header class="header">
            <button id="menu-btn" class="menu-btn">☰</button>
            <h1>Kedai Runcit</h1>

            <div class="header-actions">

                <button class="icon-btn settings-btn">
                    <img src="assets/icons/gear.png">
                </button>

                <button class="icon-btn logout-btn">
                    <img src="assets/icons/logout.png">
                </button>

            </div>
        </header>

        <!--SIDEBAR-->
        <aside class="sidebar" id="sidebar">
            <a href="dashboard.html">
                Dashboard
            </a>
            <a href="inventory.html">
                Inventory
            </a>
            <a href="orders.html">
                Orders
            </a>
            <a href="reports.html">
                Reports
            </a>
        </aside>

        <!--MAIN-->
        <main class="main"></main>

        <div class="resize-handle"></div>

        <!--CHATBOT-->
        <aside class="chat-panel">
            <h3>Ask Urus</h3>
            <div class="messages"></div>
            <input type="text" placeholder="Ask Urus...">
        </aside>
    </div>
</body>
</html>
